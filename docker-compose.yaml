services:
  db:
    image: postgres:15
    container_name: coffee_db
    environment:
      POSTGRES_USER: coffee_user
      POSTGRES_PASSWORD: coffee_pass
      POSTGRES_DB: coffee_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_user -d coffee_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: coffee_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: ./app/server
      dockerfile: Dockerfile
    container_name: coffee_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://coffee_user:coffee_pass@db:5432/coffee_shop
      SECRET_KEY: "your-secret-key-change-in-production"
    volumes:
      - ./app/server/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload



volumes:
  postgres_data:
  pgadmin_data: